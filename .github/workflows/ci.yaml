name: CI/CD Pipeline

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]

permissions:
  actions: read
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # Overall tests and validation
  validate:
    runs-on: ubuntu-latest
    outputs:
      unit: ${{ steps.plan.outputs.unit }}
      integration: ${{ steps.plan.outputs.integration }}
      load: ${{ steps.plan.outputs.load }}
      build: ${{ steps.plan.outputs.build }}
      docker: ${{ steps.plan.outputs.docker }}
    steps:
    - name: Checkout
      uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: Test CI planning and image retries
      run: python3 -m unittest discover -s scripts -p 'test_ci_*.py'

    - name: Select affected services
      id: plan
      run: python3 scripts/ci_plan.py

    - name: Test version validation
      run: python3 scripts/test_validate_version.py

    - name: Validate version consistency
      run: make validate-version

  # Unit Tests - Fast feedback on code quality
  unit-tests:
    runs-on: ubuntu-latest
    needs: [validate]
    if: ${{ needs.validate.outputs.unit != '[]' }}
    strategy:
      fail-fast: false
      matrix:
        service: ${{ fromJSON(needs.validate.outputs.unit) }}
    steps:
    - name: Checkout
      uses: actions/checkout@v4

    - name: Set up Code Env
      if: matrix.service.setup == 'java'
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Set up Code Env
      if: matrix.service.setup == 'ruby'
      uses: ruby/setup-ruby@v1
      with:
        ruby-version: '3.2'
        bundler-cache: true
        working-directory: ${{ matrix.service.path }}

    - name: Set up Code Env
      if: matrix.service.setup == 'dotnet'
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '8.0.x'

    - name: Set up Code Env
      if: matrix.service.setup == 'python'
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Set up Code Env
      if: matrix.service.setup == 'node'
      uses: actions/setup-node@v4
      with:
        node-version: '20'

    - name: Cache Dependencies
      if: matrix.service.setup == 'java'
      uses: actions/cache@v4
      with:
        path: ~/.m2
        key: ${{ runner.os }}-m2-${{ hashFiles('**/pom.xml') }}
        restore-keys: ${{ runner.os }}-m2

    - name: Run Tests
      working-directory: ${{ matrix.service.path }}
      env:
        SPEEDSCALE_API_KEY: ${{ secrets.SPEEDSCALE_API_KEY }}
        DB_HOST: localhost
        DB_PORT: 5432
        DB_NAME: tasks_db
        DB_USER: postgres
        DB_PASSWORD: postgres
        JWT_SECRET: test-secret-for-ci
        USE_MOCK_SERVER: 'true'
      run: ${{ matrix.service.test_cmd }}

    - name: Upload Results
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: unit-${{ matrix.service.name }}-results
        path: |
          ${{ matrix.service.path }}/target/surefire-reports/
          ${{ matrix.service.path }}/**/*.log
        retention-days: 7

  # Integration Tests - Functional correctness with proxymock
  integration-tests:
    runs-on: ubuntu-latest
    needs: [validate]
    if: ${{ needs.validate.outputs.integration != '[]' }}
    strategy:
      fail-fast: false
      matrix:
        service: ${{ fromJSON(needs.validate.outputs.integration) }}
    steps:
    - name: Checkout
      uses: actions/checkout@v4

    - name: Set up Code Env
      if: matrix.service.setup == 'ruby'
      uses: ruby/setup-ruby@v1
      with:
        ruby-version: '3.2'
        bundler-cache: true
        working-directory: ${{ matrix.service.path }}

    - name: Run Tests
      working-directory: ${{ matrix.service.path }}
      env:
        SPEEDSCALE_API_KEY: ${{ secrets.SPEEDSCALE_API_KEY }}
        DB_HOST: localhost
        DB_PORT: 5432
        DB_NAME: tasks_db
        DB_USER: postgres
        DB_PASSWORD: postgres
        JWT_SECRET: test-secret-for-ci
        USE_MOCK_SERVER: 'true'
      run: ./test-integration.sh

    - name: Upload Results
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: integration-${{ matrix.service.name }}-results
        path: |
          ${{ matrix.service.path }}/proxymock/replayed-*
          ${{ matrix.service.path }}/**/*.log
        retention-days: 7

  # Load Tests - Performance validation under load
  load-tests:
    runs-on: ubuntu-latest
    needs: [validate]
    if: ${{ needs.validate.outputs.load != '[]' }}
    strategy:
      fail-fast: false
      matrix:
        service: ${{ fromJSON(needs.validate.outputs.load) }}
    steps:
    - name: Checkout
      uses: actions/checkout@v4

    - name: Set up Code Env
      if: matrix.service.setup == 'ruby'
      uses: ruby/setup-ruby@v1
      with:
        ruby-version: '3.2'
        bundler-cache: true
        working-directory: ${{ matrix.service.path }}

    - name: Run Tests
      working-directory: ${{ matrix.service.path }}
      env:
        SPEEDSCALE_API_KEY: ${{ secrets.SPEEDSCALE_API_KEY }}
        DB_HOST: localhost
        DB_PORT: 5432
        DB_NAME: tasks_db
        DB_USER: postgres
        DB_PASSWORD: postgres
        JWT_SECRET: test-secret-for-ci
        USE_MOCK_SERVER: 'true'
      run: ./test-load.sh

    - name: Upload Results
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: load-${{ matrix.service.name }}-results
        path: |
          ${{ matrix.service.path }}/proxymock/replayed-*
          ${{ matrix.service.path }}/**/*.log
        retention-days: 7

  # Build matrix for different services
  build:
    runs-on: ubuntu-latest
    needs: [validate, unit-tests, integration-tests, load-tests]
    if: ${{ !cancelled() && !failure() && needs.validate.outputs.build != '[]' }}
    strategy:
      fail-fast: false
      matrix:
        service: ${{ fromJSON(needs.validate.outputs.build) }}
    steps:
    - name: Checkout
      uses: actions/checkout@v4

    - name: Set up Code Env
      if: contains(matrix.service.name, 'java')
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Set up Code Env
      if: contains(matrix.service.name, 'node') || matrix.service.name == 'smart-replace-demo' || matrix.service.name == 'llm-simulation-frontend'
      uses: actions/setup-node@v4
      with:
        node-version: '20'

    - name: Set up Code Env
      if: contains(matrix.service.name, 'ruby')
      uses: ruby/setup-ruby@v1
      with:
        ruby-version: '3.2'
        bundler-cache: true
        working-directory: ${{ matrix.service.path }}

    - name: Set up Code Env
      if: contains(matrix.service.name, 'csharp')
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '8.0.x'

    - name: Set up Code Env
      if: startsWith(matrix.service.name, 'go-')
      uses: actions/setup-go@v5
      with:
        go-version: '1.26.11'

    - name: Cache Dependencies
      if: contains(matrix.service.name, 'java')
      uses: actions/cache@v4
      with:
        path: ~/.m2
        key: ${{ runner.os }}-m2-${{ hashFiles('**/pom.xml') }}
        restore-keys: ${{ runner.os }}-m2

    - name: Build Service
      working-directory: ${{ matrix.service.path }}
      run: ${{ matrix.service.build_cmd }}

    - name: Upload Results
      if: always() && contains(matrix.service.name, 'java')
      uses: actions/upload-artifact@v4
      with:
        name: build-${{ matrix.service.name }}-artifacts
        path: |
          ${{ matrix.service.path }}/**/target/*.jar
        retention-days: 30

  # PRs validate the same platforms and Dockerfiles used for publication.
  docker:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    needs: [validate, unit-tests, integration-tests, load-tests, build]
    if: ${{ !cancelled() && !failure() && needs.validate.outputs.docker != '[]' }}
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        image: ${{ fromJSON(needs.validate.outputs.docker) }}
    steps:
    - name: Checkout
      uses: actions/checkout@v4

    - name: Set up QEMU
      uses: docker/setup-qemu-action@v3

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3

    - name: Expose GitHub cache runtime
      uses: crazy-max/ghaction-github-runtime@3cb05d89e1f492524af3d41a1c98c83bc3025124 # v3

    - name: Authenticate to Google Cloud
      if: github.event_name == 'push' && github.ref == 'refs/heads/master'
      uses: google-github-actions/auth@v2
      with:
        credentials_json: ${{ secrets.GOOGLE_CREDENTIALS }}

    - name: Set up Cloud SDK
      if: github.event_name == 'push' && github.ref == 'refs/heads/master'
      uses: google-github-actions/setup-gcloud@v2

    - name: Configure Docker for GCR
      if: github.event_name == 'push' && github.ref == 'refs/heads/master'
      run: gcloud auth configure-docker --quiet

    - name: Validate or publish Docker image
      env:
        IMAGE_NAME: ${{ matrix.image.name }}
        PUBLISH: ${{ github.event_name == 'push' && github.ref == 'refs/heads/master' }}
        GITHUB_TOKEN: ${{ github.token }}
      run: |
        args=("$IMAGE_NAME" --cache)
        if [ "$PUBLISH" = true ]; then
          args+=(--push)
        fi
        python3 scripts/ci_build_image.py "${args[@]}"

  summary:
    name: CI Summary
    runs-on: ubuntu-latest
    if: always()
    needs: [validate, unit-tests, integration-tests, load-tests, build, docker]
    steps:
    - name: Check selected jobs
      env:
        RESULTS: ${{ toJSON(needs) }}
      run: |
        python3 - <<'PYTHON'
        import json
        import os
        import sys

        results = json.loads(os.environ['RESULTS'])
        plan = results['validate']
        failed = plan['result'] != 'success'
        for job, key in [('unit-tests', 'unit'), ('integration-tests', 'integration'),
                         ('load-tests', 'load'), ('build', 'build'), ('docker', 'docker')]:
            selected = json.loads(plan.get('outputs', {}).get(key, '[]'))
            status = results[job]['result']
            print(f'{job}: {status} ({len(selected)} selected)')
            if selected and status != 'success':
                failed = True
            elif status not in ('success', 'skipped'):
                failed = True
        sys.exit(1 if failed else 0)
        PYTHON
