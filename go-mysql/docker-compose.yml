services:
  mysql:
    image: mysql:8.4
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: app
      MYSQL_USER: demo
      MYSQL_PASSWORD: demo
    ports:
      - "3306:3306"
    # Ping over TCP: during first-start initialisation MySQL runs a temporary
    # server with networking disabled, so this only passes once the real
    # server is accepting connections.
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-udemo", "-pdemo"]
      interval: 5s
      timeout: 5s
      retries: 20

  app:
    build: .
    environment:
      MYSQL_HOST: mysql
      MYSQL_PORT: "3306"
      MYSQL_USER: demo
      MYSQL_PWD: demo
      MYSQL_DATABASE: app
    ports:
      - "8080:8080"
    depends_on:
      mysql:
        condition: service_healthy
