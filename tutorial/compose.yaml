# Postgres for the tutorial orders service. The app itself runs from source
# so proxymock can start it and record its traffic.
#
#   docker compose up -d
#
# Set TUTORIAL_DB_PORT if something else already listens on 5432.
services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: tutorial
      POSTGRES_PASSWORD: tutorial
      POSTGRES_DB: tutorial
    ports:
      - "${TUTORIAL_DB_PORT:-5432}:5432"
    volumes:
      - ./contract/schema.sql:/docker-entrypoint-initdb.d/schema.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tutorial -d tutorial"]
      interval: 2s
      timeout: 3s
      retries: 30
